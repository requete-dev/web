name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'biome.json'
            docs:
              - 'apps/docs/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'biome.json'

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Cache node_modules
        uses: actions/cache@v4
        id: nm-cache-web
        with:
          path: |
            node_modules
            apps/web/node_modules
          key: ${{ runner.os }}-nm-web-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm install --frozen-lockfile
        if: steps.nm-cache-web.outputs.cache-hit != 'true'

      - name: Lint
        run: pnpm --filter requete-web lint

      - name: Typecheck
        run: pnpm --filter requete-web typecheck

      - name: Build
        run: pnpm --filter requete-web build

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Cache node_modules
        uses: actions/cache@v4
        id: nm-cache-docs
        with:
          path: |
            node_modules
            apps/docs/node_modules
          key: ${{ runner.os }}-nm-docs-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm install --frozen-lockfile
        if: steps.nm-cache-docs.outputs.cache-hit != 'true'

      - name: Cache Docusaurus build
        uses: actions/cache@v4
        with:
          path: |
            apps/docs/.cache
            apps/docs/.docusaurus
          key: ${{ runner.os }}-docusaurus-${{ hashFiles('apps/docs/src/**', 'apps/docs/docs/**', 'apps/docs/docusaurus.config.*', 'apps/docs/sidebars.*') }}
          restore-keys: |
            ${{ runner.os }}-docusaurus-

      - name: Lint
        run: pnpm --filter requete-docs lint

      - name: Typecheck
        run: pnpm --filter requete-docs typecheck

      - name: Build
        run: pnpm --filter requete-docs build

  ci:
    name: CI
    if: always()
    needs: [web, docs]
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed or were skipped
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          for result in $results; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "Job failed with result: $result"
              exit 1
            fi
          done
